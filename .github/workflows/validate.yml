name: Validate deals

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate YAML
        run: python3 scripts/validate.py
      - name: README is generated
        run: python3 scripts/build_readme.py --check
